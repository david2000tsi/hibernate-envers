spring.application.name: hibernate-envers
spring.jpa.properties.hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto: update
spring.jpa.show-sql: true
spring.datasource.driver-class-name: org.postgresql.Driver
spring.datasource.url: jdbc:postgresql://localhost:5432/hibernate_envers?createDatabaseIfNotExist
spring.datasource.username: user_envers
spring.datasource.password: pass_envers
spring.jpa.properties.org.hibernate.envers.store_data_at_delete: true
